services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: infinity_mart_dev
      POSTGRES_DB: infinity_mart
    ports:
      - "5433:5432"
    volumes:
      - infinity_mart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:infinity_mart_dev@db:5432/infinity_mart
    ports:
      - "8501:8501"
    command: ["python", "-m", "streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:infinity_mart_dev@db:5432/infinity_mart
      API_JWT_SECRET: change-this-in-production
    ports:
      - "8000:8000"
    command: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  infinity_mart_pgdata:
